    cmake-args: -DCONFIG_A320_FPD_DIAGNOSTICS=y -DCONFIG_A320_LOG_LEVEL=3 -DCONFIG_ZMK_LOGGING_MINIMAL=y -DCONFIG_ZMK_LOG_LEVEL_OFF=y -DCONFIG_LOG_DEFAULT_LEVEL=0 -DCONFIG_SENSOR_LOG_LEVEL_OFF=y -DCONFIG_LOG_BACKEND_UART=y
    artifact-name: left-touchpad-fpd-diagnostics


    
  - board: zitaotech_sofle_right
    shield: lpm_view;right_trackpoint



  - board: zitaotech_sofle_left
    shield: lpm_view;left_bbtrackball;settings_reset
  - board: zitaotech_sofle_left
    shield: lpm_view;left_bbtrackpad;settings_reset
  - board: zitaotech_sofle_right
    shield: lpm_view;right_trackpoint;settings_reset
